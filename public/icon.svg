<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Financing the Future">
  <title>Financing the Future</title>
  <!-- Favicon variant: the full mark loses all detail below ~32px, so this is a
       deliberately simplified, high-contrast lockup — solid green field, three
       stepped bars, one ascending arrow. Reads at 16px. -->
  <rect width="64" height="64" rx="12" fill="#15803d" />
  <g fill="#ffffff">
    <rect x="12" y="38" width="10" height="14" rx="2" />
    <rect x="27" y="31" width="10" height="21" rx="2" />
    <rect x="42" y="24" width="10" height="28" rx="2" />
  </g>
  <g fill="none" stroke="#a7f3c4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 30 L26 19 L36 25 L50 12" />
    <path d="M40 11 L51 11 L51 22" />
  </g>
</svg>
